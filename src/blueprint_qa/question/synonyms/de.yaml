# Deutsche Wörter für das Plan-Vokabular (design rule Q4).
# Keys MUST be names/values from blueprint_qa.contracts.VOCABULARIES; validated at load time.
# Plan abbreviations included: SZ, WZ, KiZi, AR, HWR, Bad, Gäste-WC, Kü.
RoomType:
  BEDROOM: [Schlafzimmer, SZ, Kinderzimmer, KiZi, Gästezimmer, Elternschlafzimmer]
  BATHROOM: [Badezimmer, Bad, Duschbad, Duschraum]
  TOILET: [WC, Gäste-WC, Toilette, Klo, Gästetoilette]
  KITCHEN: [Küche, Kü, Kochnische, Wohnküche, Pantryküche]
  LIVING_ROOM: [Wohnzimmer, WZ, Wohnraum, Stube]
  DINING_ROOM: [Esszimmer, Essbereich, Essen, EZ]
  HALLWAY: [Flur, Diele, Gang, Eingang, Korridor, Windfang, FL]
  GARAGE: [Garage, Carport, Ga]
  STORAGE: [Abstellraum, AR, Abstellkammer, Vorratsraum, Speisekammer, Lager]
  CLOSET: [Ankleide, Schrank, Einbauschrank, begehbarer Kleiderschrank]
  LAUNDRY: [Hauswirtschaftsraum, HWR, Waschküche, Wäscheraum]
  SAUNA: [Sauna]
  BALCONY: [Balkon, Terrasse, Loggia, Dachterrasse]
  OFFICE: [Arbeitszimmer, Büro, AZ, Homeoffice]
  TECHNICAL: [Technikraum, Heizungsraum, Heizraum, HAR]
  OTHER: [sonstiger Raum, Hobbyraum, Mehrzweckraum]
  UNKNOWN: [unbekannter Raum, unbeschrifteter Raum]
EntityCategory:
  ROOM: [Raum, Räume, Zimmer]
  DOOR: [Tür, Türen, Haustür, Eingangstür]
  WINDOW: [Fenster]
  WALL: [Wand, Wände, Mauer]
  STAIR: [Treppe, Treppen, Treppenhaus]
  STOREY: [Geschoss, Stockwerk, Etage, Ebene, EG, OG, KG, DG]
  WHOLE_PLAN: [Haus, Wohnung, Gebäude, gesamt, Gesamtfläche, Wohnfläche]
  FIXTURE: [Sanitärobjekt, Sanitärobjekte, Sanitäreinrichtung, Sanitärgegenstand]
StoreyLevel:
  BASEMENT: [Keller, Kellergeschoss, KG, Untergeschoss, UG, Souterrain]
  GROUND: [Erdgeschoss, EG, Parterre]
  UPPER: [Obergeschoss, OG, oben, obere Etage]
  UPPER_1: [1. Obergeschoss, 1. OG, erster Stock, 1. Stock]
  UPPER_2: [2. Obergeschoss, 2. OG, zweiter Stock, 2. Stock]
  UPPER_3: [3. Obergeschoss, 3. OG, dritter Stock, 3. Stock]
  ATTIC: [Dachgeschoss, DG, Dachboden, Spitzboden]
FixtureType:
  TOILET: [WC-Becken, WC-Schüssel, Toilettenschüssel, Kloschüssel, Toilette (Becken)]
  SINK: [Waschbecken, Waschtisch, Handwaschbecken, Spüle, Spülbecken]
  SHOWER: [Dusche, Duschkabine, Duschwanne, Duschtasse]
  BATHTUB: [Badewanne, Wanne]
  SAUNA_BENCH: [Saunabank, Saunabänke, Saunaliege]
  OTHER: [sonstiges Sanitärobjekt, Bidet, Urinal]
OpeningKind:
  DOOR: [Tür]
  WINDOW: [Fenster]
  OPENING: [Öffnung, Durchgang, Wanddurchbruch]
examples:
  - id: count_rooms_upper
    question: "Wie viele Zimmer gibt es im 1. OG?"
    expect:
      intent: COUNT
      aggregation: SUM
      targets: [{category: ROOM, storey: UPPER_1}]
  - id: count_windows
    question: "Wie viele Fenster hat die Wohnung?"
    expect:
      intent: COUNT
      aggregation: SUM
      targets: [{category: WINDOW}]
  - id: height_living
    question: "Wie hoch ist die Decke im Wohnzimmer?"
    expect:
      intent: HEIGHT
      aggregation: SINGLE
      targets: [{category: ROOM, room_type: LIVING_ROOM}]
  - id: compare_bath_m2
    question: "Ist das Bad größer als 8 m²?"
    expect:
      intent: COMPARISON
      aggregation: SINGLE
      targets: [{category: ROOM, room_type: BATHROOM}]
      comparison: {measure: AREA, operator: GT, threshold: 8}
      threshold_unit: m2
  - id: exists_balcony
    question: "Hat die Wohnung einen Balkon?"
    expect:
      intent: EXISTENCE
      aggregation: SUM
      targets: [{category: ROOM, room_type: BALCONY}]
  - id: ratio_bedrooms
    question: "Welchen Anteil der Wohnfläche nehmen die Schlafzimmer ein?"
    expect:
      intent: RATIO
      aggregation: SUM
      targets: [{category: ROOM, room_type: BEDROOM}, {category: WHOLE_PLAN}]
  - id: exists_bathtub
    question: "Gibt es eine Badewanne?"
    expect:
      intent: EXISTENCE
      aggregation: SUM
      targets: [{category: FIXTURE, fixture_type: BATHTUB}]
