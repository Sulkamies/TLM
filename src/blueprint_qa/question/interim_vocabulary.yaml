# INTERIM plan vocabulary, pending contract change 004 (docs/contract-changes/004-storey-levels.md).
#
# ry decided (2026-11-14, OPEN_QUESTIONS Q5) that storeys get fixed values "for now". Only A0 may add
# them to contracts/vocabulary.py, so until 004 is applied A2 keeps them here, in the same shape as
# contracts.VOCABULARIES / DESCRIPTIONS. `field` is the free-text EntityRef field they constrain.
#
# vocabulary_view.py ignores an entry as soon as a vocabulary of the same name exists in contracts,
# so applying 004 needs no A2 code change; delete the entry (or this file) afterwards.
StoreyLevel:
  field: storey
  values:
    BASEMENT: "Floor below ground level (cellar, basement)."
    GROUND: "Floor at ground or entrance level. Finnish '1. kerros' and US English 'first floor' mean this level."
    UPPER: "A floor above ground named without a number ('upstairs', 'the upper floor')."
    UPPER_1: "First floor above ground level (British/European 'first floor', German '1. OG', Finnish '2. kerros')."
    UPPER_2: "Second floor above ground level (German '2. OG', Finnish '3. kerros')."
    UPPER_3: "Third floor above ground level (German '3. OG', Finnish '4. kerros')."
    ATTIC: "Attic or loft floor directly under the roof."
