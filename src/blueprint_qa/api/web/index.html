<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Q&amp;A</title>
<!-- Browser client of POST /ask (spec: docs/API.md). Same contract as the Android app. Custodian: A0. -->
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --accent: #2f5bd3; --accent-text: #ffffff; --error: #b3261e; --box: #e5484d; --box-hi: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --surface: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
      --accent: #7b9bff; --accent-text: #0d1220; --error: #ff8a80; --box: #ff6b6b; --box-hi: #7b9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 14px; text-align: center;
          color: var(--muted); cursor: pointer; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #drop strong { color: var(--text); }
  .stage { position: relative; display: none; }
  .stage img { display: block; width: 100%; height: auto; border-radius: 6px; image-orientation: from-image; }
  .box { position: absolute; border: 2px solid var(--box); border-radius: 3px; pointer-events: none; }
  .box span { position: absolute; left: -2px; top: -18px; background: var(--box); color: #fff;
              font-size: 11px; padding: 0 4px; border-radius: 3px; white-space: nowrap; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .file-name { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
                     background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: 0; padding: 0; background: none; color: var(--accent); }
  #items { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
  #items li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #items li.hi { border-color: var(--accent); }
  .q { color: var(--muted); font-size: 14px; }
  .big { font-size: 30px; font-weight: 600; }
  .unit { font-size: 16px; color: var(--muted); margin-left: 6px; }
  .text { margin-top: 2px; }
  .working { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .err { color: var(--error); }
  .hint { color: var(--muted); font-size: 13px; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line);
          border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite;
          vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Blueprint Q&amp;A</h1>
  <p>Choose a floor plan and ask questions about it, e.g. “How many bedrooms are there?” (English, Deutsch, suomi).</p>
</header>
<main>
  <section class="card" aria-label="Floor plan">
    <div id="drop" tabindex="0" role="button">
      <strong>Choose a picture</strong> or drop it here<br>
      <span class="hint">PNG, JPEG or a one-page PDF</span>
    </div>
    <input id="file" type="file" accept="image/png,image/jpeg,application/pdf" hidden>
    <div class="stage" id="stage"><img id="plan" alt="The chosen floor plan"></div>
    <div class="row" id="fileRow" hidden>
      <span class="file-name" id="fileName"></span>
      <button type="button" id="change">Choose another</button>
    </div>
  </section>
  <section class="card" aria-label="Questions">
    <form id="ask">
      <input id="question" type="text" placeholder="Ask about the plan…" autocomplete="off" disabled>
      <button class="primary" id="send" disabled>Ask</button>
    </form>
    <p class="hint" id="status">Choose a floor plan first.</p>
    <ul id="items"></ul>
  </section>
</main>
<script>
"use strict";
// State: the chosen file, its Q&A items, and which answer's evidence is drawn.
const $ = (id) => document.getElementById(id);
let file = null, generation = 0, nextId = 0, highlighted = null;
const items = new Map();

function choose(f) {
  if (!f) return;
  file = f; generation++; items.clear(); highlighted = null;
  $("items").replaceChildren();
  $("fileName").textContent = f.name;
  $("fileRow").hidden = false;
  $("drop").style.display = "none";
  const isImage = f.type === "image/png" || f.type === "image/jpeg";
  $("stage").style.display = isImage ? "block" : "none";
  if (isImage) $("plan").src = URL.createObjectURL(f);
  $("status").textContent = isImage ? "" : "PDF chosen: answers work, the drawing is not previewed.";
  $("question").disabled = $("send").disabled = false;
  $("question").focus();
  drawEvidence();
}

function ask(question) {
  const id = nextId++, gen = generation, item = { id, question, state: "loading" };
  items.set(id, item); render(item); send(item, gen);
}

async function send(item, gen) {
  const body = new FormData();
  body.append("image", file, file.name);
  body.append("question", item.question);
  if (navigator.language) body.append("locale", navigator.language);
  let result;
  try {
    const r = await fetch("ask", { method: "POST", body, headers: { Accept: "application/json" } });
    const json = await r.json().catch(() => null);
    if (!r.ok) result = { state: "error", error: (json && json.error) || `Server returned ${r.status}` };
    else if (!json || json.answer === null || json.answer === undefined) result = { state: "error", error: "Server sent no answer" };
    else result = { state: "done", answer: json };
  } catch (e) {
    result = { state: "error", error: "Could not reach the server." };
  }
  if (gen !== generation) return;          // the picture changed meanwhile: drop the result
  Object.assign(item, result); render(item);
  if (item.answer && item.answer.evidence && item.answer.evidence.length) { highlighted = item.id; renderAll(); }
}

function formatValue(v) {
  if (typeof v !== "number") return String(v);
  return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100);
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = text;   // text only: server strings are never parsed as HTML
  return node;
}

function render(item) {
  let li = document.querySelector(`li[data-id="${item.id}"]`);
  if (!li) { li = el("li"); li.dataset.id = item.id; $("items").append(li); }
  li.className = item.id === highlighted ? "hi" : "";
  li.replaceChildren(el("div", "q", item.question));
  if (item.state === "loading") {
    const w = el("div", "hint"); w.append(el("span", "spin"), "Working… (the first question can take ~15 s)"); li.append(w);
  } else if (item.state === "error") {
    li.append(el("div", "err", item.error));
    const retry = el("button", "link", "Try again");
    retry.type = "button";
    retry.onclick = () => { item.state = "loading"; render(item); send(item, generation); };
    li.append(retry);
  } else {
    const a = item.answer;
    if (a.type === "text" || String(a.answer).length > 12) {
      li.append(el("div", "text", formatValue(a.answer)));
    } else {
      const big = el("div", "big", formatValue(a.answer));
      if (a.unit && a.unit !== "count") big.append(el("span", "unit", a.unit));
      li.append(big);
    }
    if (a.working) li.append(el("div", "working", a.working));
    if (a.evidence && a.evidence.length && $("stage").style.display !== "none") {
      const b = el("button", "link",
        `${item.id === highlighted ? "Marked on the drawing" : "Show on the drawing"} (${a.evidence.length})`);
      b.type = "button";
      b.onclick = () => { highlighted = item.id; renderAll(); };
      li.append(b);
    }
  }
}

function renderAll() { items.forEach(render); drawEvidence(); }

function drawEvidence() {
  const stage = $("stage");
  stage.querySelectorAll(".box").forEach((b) => b.remove());
  const item = items.get(highlighted);
  const boxes = (item && item.answer && item.answer.evidence) || [];
  boxes.forEach((box, i) => {
    const div = el("div", "box");
    Object.assign(div.style, { left: `${box.x * 100}%`, top: `${box.y * 100}%`, width: `${box.w * 100}%`, height: `${box.h * 100}%` });
    div.title = box.label;
    div.append(el("span", null, `${i + 1} ${box.label}`));
    stage.append(div);
  });
}

// Wiring: picking, drag and drop, asking.
const drop = $("drop"), input = $("file");
drop.onclick = () => input.click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") input.click(); };
$("change").onclick = () => input.click();
input.onchange = () => { choose(input.files[0]); input.value = ""; };
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => choose(e.dataTransfer.files[0]));
$("ask").onsubmit = (e) => {
  e.preventDefault();
  const q = $("question").value.trim();
  if (!q || !file) return;
  $("question").value = "";
  ask(q);
};
</script>
</body>
</html>
