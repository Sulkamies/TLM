name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # R7.3: CI never needs network access to LLMs or API keys.
      BP_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,server]"
      - name: Format
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Types (mypy --strict)
        run: mypy
      - name: Contract schemas up to date
        run: python -m blueprint_qa.contracts.generate_schema --check
      - name: Tests (unit, contract, integration, e2e-mock)
        run: pytest --cov=blueprint_qa --cov-report=term-missing --cov-fail-under=80
